# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# The app code lives in DuoBuild.swiftpm so the iPad Playgrounds app and the
# App Store app share one copy.
name: DuoBuild
options:
  bundleIdPrefix: com.ariberkowitz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HKA3SA3729
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DuoBuild:
    type: application
    platform: iOS
    sources:
      # Point at the folders inside, not the .swiftpm folder itself:
      # Xcode would copy a ".swiftpm" folder in as a file instead of compiling it.
      - DuoBuild.swiftpm/App
      - DuoBuild.swiftpm/Sources
      - AppAssets/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariberkowitz.duobuild
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: AppAssets/Info.plist
      properties:
        CFBundleDisplayName: DuoBuild
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Leave empty to start in Demo mode. Put your own backend's https address here
        # to ship a default. Never put an API key here.
        DuoBuildBackendURL: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  DuoBuildTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DuoBuildTests
    dependencies:
      - target: DuoBuild
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariberkowitz.duobuild.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DuoBuild:
    build:
      targets:
        DuoBuild: all
    test:
      targets:
        - DuoBuildTests
    run:
      config: Debug
    archive:
      config: Release
